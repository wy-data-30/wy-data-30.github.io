<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>页面不存在 · Page not found</title>
  <script>
    // Old links under /smart-tabular-analyzer/ (for example the sample CSV) go to the same place
    // under /sheet-checkup/, with the query and the hash. Anything else stays a plain 404 page.
    (function () {
      var oldPrefix = "/smart-tabular-analyzer";
      var path = location.pathname;
      if (path === oldPrefix || path.indexOf(oldPrefix + "/") === 0) {
        location.replace("https://wy-data-30.github.io/sheet-checkup" + (path.slice(oldPrefix.length) || "/") + location.search + location.hash);
      }
    })();
  </script>
</head>
<body>
  <p>页面不存在。表格体检在 <a href="https://wy-data-30.github.io/sheet-checkup/">wy-data-30.github.io/sheet-checkup</a></p>
  <p>Page not found. Sheet Checkup is at <a href="https://wy-data-30.github.io/sheet-checkup/?lang=en">wy-data-30.github.io/sheet-checkup</a></p>
</body>
</html>
